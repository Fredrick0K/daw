<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML Test Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
      background: #f4f6f8;
      color: #222;
    }

    .card {
      padding: 24px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 12px #0002;
    }

    button {
      padding: 10px 16px;
      border: 0;
      border-radius: 6px;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>HTML Test Page</h1>
    <p>If you can see this, your HTML is working.</p>
    <button onclick="document.getElementById('message').textContent = 'Button works!'">
      Test button
    </button>
    <p id="message"></p>
  </main>
</body>
</html>
