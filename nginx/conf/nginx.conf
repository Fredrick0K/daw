# Varios sitios web distintos en la MISMA maquina y el MISMO puerto.
# nginx decide cual servir mirando la cabecera Host que manda el navegador.
#
# Para probarlo con nombres de verdad sin tocar el fichero hosts (que pide administrador):
# los navegadores y curl entienden que todo lo que acaba en .localhost es este equipo.
#    http://sitio-a.localhost:8080    -> sitio A
#    http://sitio-b.localhost:8080    -> sitio B

worker_processes  auto;
events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    
    client_max_body_size 1m;            # lo de mas de 1 MB, 413 (ejemplo 2)

    gzip              on;               # comprimir (ejemplo 3)
    gzip_min_length   256;
    gzip_types        text/plain text/css application/javascript application/json;

    # el formato propio, con lo que tarda cada peticion (ejemplo 7 y practica 3)
    log_format detallado '$time_iso8601 | $remote_addr | $request_method $request_uri | $status | $body_bytes_sent bytes | $request_time s';
    error_log  logs/error.log  warn;

    upstream api {
        server 127.0.0.1:8000;          # la API, con waitress (ejemplo 17)
    }
    # como en el ejemplo 2: sin version

    server {
        listen       127.0.0.1:8080 default_server;
        server_name  _;
        return 444;                            # cierra la conexion sin responder
    }

    server {
        listen       127.0.0.1:8080;
        server_name  publica.localhost;
        return 301 https://$host:8443$request_uri;
    }

    server {
        listen       127.0.0.1:8443 ssl;
        server_name  publica.localhost;
        ssl_certificate      publica.crt;
        ssl_certificate_key  publica.key;
        ssl_protocols        TLSv1.2 TLSv1.3;
        ssl_ciphers          HIGH:!aNULL:!MD5;
        add_header Strict-Transport-Security "max-age=31536000";
        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "SAMEORIGIN";

        root   sitios/publica;
        index  index.html;
        access_log  logs/publica.log  detallado;
        error_page 404             /404.html;
        error_page 500 502 503 504 /50x.html;

        # --- ZONAS PROTEGIDAS (PASO 6) ---
        location /socios/ {
            auth_basic            "Zona de socios";
            auth_basic_user_file  usuarios.txt;
        }
 
        location /admin/ {
            stub_status;
            allow 127.0.0.1;
            deny  all;
        }
 
        location /oficina/ {
            allow 192.168.1.0/24;
            deny  all;
        }
        # --- API EN NGINX (CONFIGURACIÓN PASO)
        location /api / {
            proxy_pass http://aplicacion;
            client_max_body_size 1k;
            proxy_pass http://api;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # --- SERVIDOR DE DESCARGAS (PASO 7) ---
    server {
        listen       127.0.0.1:8080;
        server_name  descargas.localhost;
        root   sitios/descargas;
        include       mime.types;
        default_type  application/octet-stream;
        access_log  logs/descargas.log  detallado;
        autoindex            on;
        autoindex_exact_size off;
        autoindex_localtime  on;


    }

    # -- 
}