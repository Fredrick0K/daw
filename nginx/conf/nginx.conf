worker_processes auto;
events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    client_max_body_size 1m;

    gzip on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json;

    log_format detallado '$time_iso8601 | $remote_addr | $request_method $request_uri | $status | $body_bytes_sent bytes | $request_time s';
    error_log /var/log/nginx/error.log warn;

    # Compose resuelve estos nombres de servicio hacia los contenedores Python.
    upstream api {
        server api:8000;
    }

    upstream avisos {
        server avisos:8001;
    }

    server {
        listen 80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 80;
        server_name descargas.localhost;
        root /usr/share/nginx/html/descargas;
        index index.html;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
    }

    server {
        listen 443 ssl default_server;
        server_name localhost publica.localhost;

        ssl_certificate /etc/nginx/certs/publica.crt;
        ssl_certificate_key /etc/nginx/certs/publica.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        add_header Strict-Transport-Security "max-age=31536000";
        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "SAMEORIGIN";

        root /usr/share/nginx/html/publica;
        index index.html;
        access_log /var/log/nginx/publica.log detallado;
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;

        location /socios/ {
            auth_basic "Zona de socios";
            auth_basic_user_file /etc/nginx/usuarios.txt;
        }

        location /api/ {
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /avisos {
            return 301 /avisos/;
        }

        location = /avisos/ {
            auth_basic "Zona de socios";
            auth_basic_user_file /etc/nginx/usuarios.txt;
            proxy_pass http://avisos/avisos;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}