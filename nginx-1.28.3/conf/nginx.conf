worker_processes  auto;
events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    
    client_max_body_size 1m;            

    gzip              on;               
    gzip_min_length   256;
    gzip_types        text/plain text/css application/javascript application/json;

    log_format detallado '$time_iso8601 | $remote_addr | $request_method $request_uri | $status | $body_bytes_sent bytes | $request_time s';
    error_log  logs/error.log  warn;

    # Define la API local; el bloque /api/ la utiliza como destino.
    upstream api {
        server 127.0.0.1:8000;          
    }

    server {
        listen       127.0.0.1:8080 default_server;
        server_name  _;
        return 444;                            
    }

    server {
        listen       127.0.0.1:8080;
        server_name  publica.localhost;
        return 301 https://$host:8443$request_uri;
    }

    server {
        listen       127.0.0.1:8443 ssl;  # Atiende HTTPS local en el puerto 8443.
        server_name  publica.localhost;  # Asocia el sitio público con este nombre.
        ssl_certificate      publica.crt;  # Carga el certificado HTTPS.
        ssl_certificate_key  publica.key;  # Carga la clave privada del certificado.
        ssl_protocols        TLSv1.2 TLSv1.3;  # Permite solo TLS moderno.
        ssl_ciphers          HIGH:!aNULL:!MD5;  # Excluye cifrados débiles o sin autenticación.
        add_header Strict-Transport-Security "max-age=31536000";  # Indica al navegador usar HTTPS durante un año.
        add_header X-Content-Type-Options "nosniff";  # Evita que el navegador adivine el tipo de contenido.
        add_header X-Frame-Options "SAMEORIGIN";  # Solo permite mostrar la página en marcos del mismo sitio.

        root   sitios/publica;
        index  index.html;
        access_log  logs/publica.log  detallado;
        error_page 404             /404.html;
        error_page 500 502 503 504 /50x.html;

        # --- ZONAS PROTEGIDAS (PASO 6) ---
        location /socios/ {
            auth_basic            "Zona de socios";
            auth_basic_user_file  usuarios.txt;
        }
 
        #location /api/ {
        #   client_max_body_size 1k;
        #   proxy_pass http://api;

        #   proxy_set_header Host              $host;
        #   proxy_set_header X-Real-IP         $remote_addr;
        #   proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        #   proxy_set_header X-Forwarded-Proto $scheme;
        #}

        # Protege los avisos y reenvía la petición al servidor local del puerto 8001.
        location = /avisos {
            auth_basic            "Zona de socios";
            auth_basic_user_file  usuarios.txt;
            proxy_pass            http://127.0.0.1:8001;
            proxy_set_header      X-Real-IP $remote_addr;
        }

        # --- API EN NGINX (CONFIGURACIÓN PASO)
        # Reenvía las peticiones de la API al puerto 8000 y limita el cuerpo a 1 KB.
        location /api/ {
            proxy_pass http://api;
            client_max_body_size 1k;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen       127.0.0.1:8080;       # Escucha las descargas solo en este equipo.
        server_name  descargas.localhost;  # Selecciona este sitio por el nombre solicitado.
        root   sitios/descargas;           # Define la carpeta de archivos descargables.
        include       mime.types;          # Carga los tipos MIME conocidos.
        default_type  application/octet-stream;  # Tipo usado si el MIME no está definido.
        access_log  logs/descargas.log  detallado;  # Guarda las solicitudes en este formato.
        autoindex            on;            # Muestra el listado si la carpeta no tiene índice.
        autoindex_exact_size off;           # Muestra tamaños redondeados en el listado.
        autoindex_localtime  on;            # Muestra las fechas en la hora local.


    }
}
